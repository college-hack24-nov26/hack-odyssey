id: water
platform: water
task: water_rescue
task_params: {range_m: 100}
threshold: 0.75
baseline: the built-in simple controller (steer at the person, slow down when close)
hazards:
  - id: waves
    title: Waves
    plain: "How tall the waves are (significant wave height). The model moves the boat up and down and tilts it with the water surface: it does not model waves breaking over the deck or slamming, so passing here is the easy half of the question."
    unit: m
    knob: wave_hs
    levels: [0.0, 0.15, 0.3, 0.45, 0.6, 0.9]
    ask: wave_hs
    source: "Rescue boat operating limits (ISO 12217 via the UK Rescue Boat Code): sheltered water 0.3 m, inshore 2 m, offshore 4 m."
    fix: "A bigger or higher-sided hull, more thrust, or a heavier keel. Rough water also needs two independent thrusters."
  - id: wind
    title: Wind
    plain: How hard the wind blows across the boat.
    unit: m/s
    knob: wind_ms
    levels: [0, 4, 8, 12, 16]
    ask: wind_ms
    source: "Beaufort 4 is about 6-8 m/s, Beaufort 6 about 11-14 m/s (rescue boat operating categories)."
    fix: "More thrust (a bigger or second thruster), or a lower, smaller boat that catches less wind."
  - id: current
    title: Current
    plain: How fast the water itself is moving past the shore.
    unit: m/s
    knob: current_ms
    levels: [0.0, 0.5, 1.0, 1.5, 2.5]
    source: "Rivers in flood and tidal races commonly run 1-3 m/s."
    fix: "More thrust. A boat slower than the current cannot make headway against it."
  - id: debris
    title: Fixed obstacles in the water
    plain: "How many fixed obstacles (about 60 cm wide: rocks, pilings, wreckage) lie between the boat and the person. They do not move when hit, unlike floating branches, and the simple controller does not steer around them."
    unit: pieces
    task_param: debris
    levels: [0, 6, 15, 30]
    source: "Flood water carries branches, planks and bottles; the count is a stress level, not a measurement."
    fix: "A controller that sees obstacles (camera or sonar) and steers around them, and a sturdier bow."
faults:
  - id: thruster_out
    title: A thruster fails
    plain: One thruster stops working in the middle of the job (with two thrusters, one keeps working at half the power).
    hazards: {thruster_eff: auto}
    fix: "Add a second thruster so one failure does not leave the boat adrift."
  - id: rudder_stuck
    title: The rudder jams straight
    plain: The rudder stops responding and stays centred.
    hazards: {rudder_stuck: true}
    fix: "Steer by differential thrust with two thrusters."
  - id: wind_and_waves
    title: "A storm: waves, wind and current together"
    plain: Waves 0.45 m, wind 10 m/s and a 0.5 m/s current at the same time.
    hazards: {wave_hs: 0.45, wind_ms: 10, current_ms: 0.5}
    fix: "More thrust and a bigger hull."
not_tested:
  - Rain, fog, glare and darkness (nothing here degrades a camera or a person's visibility)
  - "Finding the person: the boat is told where they are"
  - Breaking surf, slamming of the hull in short steep waves, and waves hitting from the side at speed (the wave model acts through buoyancy only)
  - Underwater obstacles, fishing lines and weeds around the thruster
  - Floating debris that moves when hit or gets caught in the thruster
  - A person who drifts or moves
  - Radio or GPS dropouts, and salt-water corrosion or leaks
  - Cold batteries, and getting back to the shore afterwards
