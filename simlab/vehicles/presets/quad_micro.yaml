name: quad_micro
kind: multirotor
description: Palm-sized indoor quadcopter (about 45 g).
body: {mass: 0.045, length: 0.09, width: 0.09, height: 0.03}
params:
  layout: quad_x
  arm_length: 0.045
  thrust_max: 0.22
  torque_coef: 0.02
  motor_tau: 0.02
  drag: 0.01
  max_tilt_deg: 30
  max_speed: 4.0
  max_climb: 1.5
  max_descent: 1.0
  max_yaw_rate: 3.0
sensors:
  - {type: camera, name: front, forward: 0.04, height: 0.02, tilt_deg: 20, fov_deg: 90, width_px: 320, height_px: 240, fps: 20, noise: 0.02}
  - {type: imu, name: imu}
  - {type: pose, name: pose}
