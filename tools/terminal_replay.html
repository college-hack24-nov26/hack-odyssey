<!doctype html><meta charset="utf-8"><title>__TITLE__</title>
<style>
html,body{margin:0;background:#eef3fb;height:100%}
.win{margin:26px auto;width:1020px;height:640px;border-radius:12px;background:#ffffff;box-shadow:0 20px 50px #1b2a4a22;border:1px solid #d5deec;overflow:hidden;font:15px/1.5 Consolas,"Cascadia Mono",monospace;color:#1f2a44}
.bar{height:34px;background:#e8eef8;display:flex;align-items:center;padding:0 14px;gap:8px;color:#52628a;font:13px system-ui}
.dot{width:12px;height:12px;border-radius:50%}
#out{padding:16px 20px;height:580px;overflow:hidden;white-space:pre-wrap}
.cmd{color:#0b63c9;font-weight:600}.ok{color:#15803d}.warn{color:#a16207}.fix,.fail{color:#be123c}.dim{color:#64748b}.hd{color:#6d28d9;font-weight:600}
.cur{display:inline-block;width:8px;height:16px;background:#1f2a44;vertical-align:-2px;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
</style>
<div class="win"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span style="margin-left:10px">__TITLE__</span></div><div id="out"></div></div>
<script>
const L=__DATA__, out=document.getElementById('out');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
  for(const l of L){
    const d=document.createElement('div'); d.className=l.c||''; out.appendChild(d);
    if(l.c==='cmd'){ d.textContent='> '; for(const ch of l.t){ d.textContent+=ch; await sleep(28);} await sleep(450); }
    else { d.textContent=l.t; await sleep(l.w||260); }
    out.scrollTop=out.scrollHeight;
  }
  window.__done=true;
})();
</script>
