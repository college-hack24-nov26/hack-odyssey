#VRML_SIM R2025a utf8
# template language: javascript
# Parametric sewer-inspection rover. One model -> diff2wd / skid4wd / skid6wd / tracked, any size and speed.
# Robot frame (ENU): x forward, y left, z up; the origin sits on the floor under the body centre.
PROTO SewerRover [
  field SFVec3f    translation      0 0 0.02
  field SFRotation rotation         0 0 1 0
  field SFString   name             "rover"
  field SFString   controller       "sewerbot_rover"
  field SFString   customData       ""
  field SFString   driveType        "skid4wd"   # diff2wd | skid4wd | skid6wd | tracked
  field SFFloat    bodyLength       0.35
  field SFFloat    bodyWidth        0.26
  field SFFloat    bodyHeight       0.12
  field SFFloat    wheelRadius      0.05
  field SFFloat    mass             3.5
  field SFFloat    maxSpeed         0.5
  field SFFloat    cameraHeight     0.14
  field SFFloat    cameraTilt       0.14
  field SFFloat    cameraFov        1.2
  field SFInt32    cameraPixelsW    640
  field SFInt32    cameraPixelsH    480
  field SFFloat    cameraNoise      0.02
  field SFFloat    cameraMotionBlur 0
  field SFString   cameraProjection "planar"
  field SFBool     cameraSegmentation TRUE    # per-instance masks -> pixel-exact ground-truth boxes
  field SFFloat    lightIntensity   1.2
]
{
  %<
    const L = fields.bodyLength.value;
    const W = fields.bodyWidth.value;
    const H = fields.bodyHeight.value;
    const r = fields.wheelRadius.value;
    const M = fields.mass.value;
    const vmax = fields.maxSpeed.value;
    const drive = fields.driveType.value;
    const camH = fields.cameraHeight.value;
    const ww = Math.min(0.06, Math.max(0.015, 0.5 * r));           // wheel / track width
    const clearance = 0.4 * r;                                      // body underside above the floor
    const bodyW = W - 2 * ww - 0.004;
    const yWheel = W / 2 - ww / 2;
    const maxOmega = 1.3 * vmax / r;                                // rad/s, 30% headroom
    const torque = Math.max(0.5, M * 9.81 * r * 1.2);                // enough to scrub through a skid-steer turn
    let xs = [];
    if (drive === 'diff2wd') xs = [0];
    else if (drive === 'skid4wd') xs = [0.30 * L, -0.30 * L];
    else if (drive === 'skid6wd') xs = [0.35 * L, 0, -0.35 * L];
    else if (drive === 'tracked') xs = [0.375 * L, 0.125 * L, -0.125 * L, -0.375 * L];   // road wheels under a belt
    const wheels = [];
    xs.forEach((x, i) => { wheels.push({n: 'wheel_l' + i, x: x, y: yWheel}); wheels.push({n: 'wheel_r' + i, x: x, y: -yWheel}); });
    const nDriven = Math.max(1, wheels.length);
    const wheelMass = 0.30 * M / nDriven;
    const rc = 0.45 * r;                                            // caster ball radius
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    supervisor TRUE
    children [
      Pose {
        translation 0 0 %<= clearance + H / 2 >%
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.95 0.75 0.1 roughness 0.6 metalness 0 }
            geometry Box { size %<= L >% %<= bodyW >% %<= H >% }
          }
        ]
      }
      # camera housing + camera (looks along +x, pitched down by cameraTilt)
      Pose {
        translation %<= L / 2 - 0.02 >% 0 %<= camH >%
        rotation 0 1 0 %<= fields.cameraTilt.value >%
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.05 0.05 0.05 roughness 0.5 metalness 0 }
            geometry Box { size 0.02 0.03 0.02 }
          }
          Camera {
            translation 0.012 0 0
            name "camera"
            fieldOfView IS cameraFov
            width IS cameraPixelsW
            height IS cameraPixelsH
            near 0.015
            noise IS cameraNoise
            motionBlur IS cameraMotionBlur
            projection IS cameraProjection
            antiAliasing TRUE
            recognition Recognition {
              maxRange 8
              occlusion 1
              frameThickness 0
              segmentation IS cameraSegmentation
            }
          }
        ]
      }
      # headlamp
      DEF HEADLAMP SpotLight {
        attenuation 0 0 1
        beamWidth 0.9
        cutOffAngle 1.15
        direction 1 0 -0.12
        intensity IS lightIntensity
        location %<= L / 2 >% 0 %<= camH + 0.03 >%
        radius 14
        castShadows FALSE
        color 1 0.98 0.92
      }
      # ultrasonic-style range sensors (metres, 4 m max, like an HC-SR04)
      DistanceSensor {
        translation %<= L / 2 >% 0 %<= clearance + H / 2 >%
        name "ds_front"
        lookupTable [ 0 0 0, 4 4 0 ]
        numberOfRays 1
      }
      DistanceSensor {
        translation %<= L / 2 - 0.02 >% %<= bodyW / 2 >% %<= clearance + H / 2 >%
        rotation 0 0 1 0.6
        name "ds_left"
        lookupTable [ 0 0 0, 4 4 0 ]
        numberOfRays 1
      }
      DistanceSensor {
        translation %<= L / 2 - 0.02 >% %<= -bodyW / 2 >% %<= clearance + H / 2 >%
        rotation 0 0 1 -0.6
        name "ds_right"
        lookupTable [ 0 0 0, 4 4 0 ]
        numberOfRays 1
      }
      %< if (drive === 'diff2wd') { >%
      Solid {
        translation %<= 0.40 * L >% 0 %<= rc >%
        name "caster_front"
        contactMaterial "caster"
        children [ Shape { appearance PBRAppearance { baseColor 0.3 0.3 0.3 metalness 0 } geometry Sphere { radius %<= rc >% subdivision 2 } } ]
        boundingObject Sphere { radius %<= rc >% }
        physics Physics { density -1 mass 0.02 }
      }
      Solid {
        translation %<= -0.40 * L >% 0 %<= rc >%
        name "caster_rear"
        contactMaterial "caster"
        children [ Shape { appearance PBRAppearance { baseColor 0.3 0.3 0.3 metalness 0 } geometry Sphere { radius %<= rc >% subdivision 2 } } ]
        boundingObject Sphere { radius %<= rc >% }
        physics Physics { density -1 mass 0.02 }
      }
      %< } >%
      %< for (const w of wheels) { >%
      HingeJoint {
        jointParameters HingeJointParameters { anchor %<= w.x >% %<= w.y >% %<= r >% axis 0 1 0 }
        device [
          RotationalMotor { name "%<= w.n >%" maxVelocity %<= maxOmega >% maxTorque %<= torque >% }
          PositionSensor { name "%<= w.n >%_sensor" }
        ]
        endPoint DEF %<= w.n.toUpperCase() >% Solid {
          translation %<= w.x >% %<= w.y >% %<= r >%
          name "%<= w.n >%_solid"
          contactMaterial "wheel"
          # ENU: a Cylinder's axis is z, so turn it 90 deg about x to align with the y-axis hinge
          children [
            Pose {
              rotation 1 0 0 1.5708
              children [
                Shape {
                  appearance PBRAppearance { baseColor 0.08 0.08 0.08 roughness 0.9 metalness 0 }
                  geometry Cylinder { height %<= ww >% radius %<= r >% subdivision 24 }
                }
              ]
            }
          ]
          boundingObject Pose {
            rotation 1 0 0 1.5708
            children [ Cylinder { height %<= ww >% radius %<= r >% subdivision 24 } ]
          }
          physics Physics { density -1 mass %<= wheelMass >% }
        }
      }
      %< } >%
      # Tracked crawlers behave kinematically like skid-steer: the belts are visual, the road wheels drive.
      %< if (drive === 'tracked') { for (const side of [1, -1]) { >%
      Pose {
        translation 0 %<= side * yWheel >% %<= r >%
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.07 0.07 0.07 roughness 1 metalness 0 }
            geometry Box { size %<= 0.75 * L + 2 * r >% %<= ww * 1.3 >% %<= 2 * r * 0.98 >% }
          }
        ]
      }
      %< } } >%
    ]
    boundingObject Pose {
      translation 0 0 %<= clearance + H / 2 >%
      children [ Box { size %<= L >% %<= bodyW >% %<= H >% } ]
    }
    physics Physics {
      density -1
      mass %<= 0.70 * M >%
      centerOfMass [ 0 0 %<= r >% ]
    }
  }
}
