  - {id: t2, from: N2, to: N3, shape: box,  width: 1.8, height: 1.5}
  - {id: t3, from: N3, to: N4, shape: oval, width: 1.6, height: 2.0}
  - {id: t4, from: N4, to: N1, shape: box,  width: 1.8, height: 1.5}
